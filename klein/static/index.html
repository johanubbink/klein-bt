<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klein — BT viewer</title>
    <!-- D3 v7 is vendored locally so the dashboard works on air-gapped robot networks -->
    <script src="/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <aside id="sidebar">
        <header id="sidebar-header">
            <div class="header-row">
                <h1>klein BT viewer</h1>
                <button id="sidebar-collapse" type="button" aria-expanded="true"
                        aria-controls="sidebar" title="Hide panel">
                    <span aria-hidden="true">«</span><span class="sr-only">Hide panel</span>
                </button>
            </div>
            <div class="status-tracker">
                <span id="conn-dot" class="dot"></span>
                <span id="conn-text">Connecting to klein gateway…</span>
            </div>
            <!-- Native radios: one keyboard-navigable group, correct semantics,
                 and the checked segment is painted with :checked + span. -->
            <div class="control-row">
                <span class="control-label" id="layout-label">Layout</span>
                <div class="segmented" role="group" aria-labelledby="layout-label">
                    <label>
                        <input type="radio" name="layout" value="vertical" checked>
                        <span>Vertical</span>
                    </label>
                    <label>
                        <input type="radio" name="layout" value="horizontal">
                        <span>Horizontal</span>
                    </label>
                </div>
            </div>
        </header>

        <h2 id="bb-heading">Blackboards<span id="bb-count"></span></h2>
        <div id="bb-panel">
            <p id="bb-empty">Waiting for values…</p>
            <div id="bb-groups"></div>
        </div>
    </aside>

    <button id="sidebar-show" type="button" hidden aria-expanded="false" aria-controls="sidebar"
            title="Show panel">
        <span aria-hidden="true">»</span><span class="sr-only">Show panel</span>
    </button>

    <div id="robot-banner"></div>

    <div id="watermark">🖱️ Scroll to Zoom | Drag canvas to Pan | Click nodes to Expand/Collapse</div>

    <svg id="canvas"></svg>

    <script src="/renderers.js"></script>
    <script src="/app.js"></script>
</body>
</html>
