<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klein — BT viewer</title>
    <!-- D3 v7 is vendored locally so the dashboard works on air-gapped robot networks -->
    <script src="/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <div id="ui-layer">
        <h1>klein BT viewer</h1>
        <div class="status-tracker">
            <span id="conn-dot" class="dot"></span>
            <span id="conn-text">Connecting to klein gateway…</span>
        </div>
        <button id="orientation-toggle">Layout: vertical</button>

        <div id="bb-section">
            <button id="bb-toggle" type="button" aria-expanded="false" aria-controls="bb-panel">
                <span class="bb-chevron" aria-hidden="true"></span>Blackboards<span id="bb-count"></span>
            </button>
            <div id="bb-panel" hidden>
                <p id="bb-empty">Waiting for values…</p>
                <div id="bb-groups"></div>
            </div>
        </div>
    </div>

    <div id="robot-banner"></div>

    <div id="watermark">🖱️ Scroll to Zoom | Drag canvas to Pan | Click nodes to Expand/Collapse</div>

    <svg id="canvas"></svg>

    <script src="/app.js"></script>
</body>
</html>
