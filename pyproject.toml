[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "klein-bt"
description = "Lightweight CLI telemetry dashboard for BehaviorTree.CPP v4 over ZeroMQ."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Ubbink", email = "25775970+johanubbink@users.noreply.github.com" }]
keywords = ["behaviortree", "behaviortree.cpp", "groot", "groot2", "robotics", "zeromq", "telemetry", "dashboard", "visualization"]
dynamic = ["version"]
dependencies = [
    "pyzmq>=25",
    "websockets>=14",
    "msgpack>=1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Embedded Systems",
]

[project.urls]
Homepage = "https://github.com/johanubbink/klein-bt"
Issues = "https://github.com/johanubbink/klein-bt/issues"
Changelog = "https://github.com/johanubbink/klein-bt/blob/main/CHANGELOG.md"

[project.scripts]
klein-bt = "klein.gateway:main_cli"
klein-bt-mock = "klein.mock_robot:main"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools]
# Only ship the klein package; the sibling test suite stays out of the wheel.
packages = ["klein"]
include-package-data = true

[tool.setuptools.dynamic]
# Single source of truth for the version: klein/__init__.py :: __version__.
version = { attr = "klein.__version__" }

[tool.setuptools.package-data]
# Bundle the dashboard web assets (and the vendored D3) so they ship on pip install.
klein = [
    "static/index.html",
    "static/styles.css",
    "static/app.js",
    "static/d3.v7.min.js",
]
